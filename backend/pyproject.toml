[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is expected in tests
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E402"]
# S105/S106 flag hardcoded credentials. In tests these are dummy fixture
# values, never real secrets.
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = []
