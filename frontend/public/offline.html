<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14213d" />
    <title>Offline · SS Tuitions</title>
    <style>
      /* Inline and self-contained: this page has to render with no network,
         so it cannot pull a stylesheet or a font. */
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f8fa;
        color: #14213d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 380px;
        background: #fff;
        border: 1px solid #e4e7ec;
        border-radius: 16px;
        padding: 40px 28px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      }
      .mark { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
      .mark span { color: #e5a33a; }
      h1 { font-size: 18px; margin: 24px 0 8px; }
      p { margin: 0; font-size: 14px; line-height: 1.6; color: #5b6472; }
      button {
        margin-top: 24px;
        width: 100%;
        padding: 12px 16px;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        color: #fff;
        background: #14213d;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:active { background: #0b1526; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">SS <span>TUITIONS</span></div>
      <h1>You are offline</h1>
      <p>
        This page needs a connection. Check your mobile data or Wi&#8209;Fi, then
        try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
