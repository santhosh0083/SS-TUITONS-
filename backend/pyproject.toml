[project]
name = "ss-tuitions-backend"
version = "1.0.0"
description = "SS Tuitions platform API"
requires-python = ">=3.12"

# RUNTIME dependencies only — this list is what serverless deploys install.
# Deliberately excluded, because app/ never imports them:
#   uvicorn  — the host provides the server
#   psycopg  — used by Alembic only; migrations run from a developer machine
#   redis    — not used yet
# pgvector IS required: app/models/ai_ml.py imports Vector for RAG embeddings.
dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
    "email-validator==2.2.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "pgvector==0.3.6",
    "cryptography==44.0.0",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is expected in tests
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E402"]
# S105/S106 flag hardcoded credentials. In tests these are dummy fixture
# values, never real secrets.
"tests/*" = ["S105", "S106"]
# Local verification script: every URL it opens is a hardcoded localhost
# address, so the "audit URL open" rule adds nothing here.
"scripts/verify_requirements.py" = ["S310"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = []
